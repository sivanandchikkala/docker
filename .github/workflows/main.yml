name: App CI/CD - Docker to Azure Web App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: myapp
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
  WEBAPP_NAME: ${{ secrets.WEBAPP_NAME }}          # Azure Web App name
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}    # RG where Web App lives

jobs:
  # 1️⃣ BUILD & TEST APPLICATION
  build_and_test:
    name: "Build and Test App"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Example: Node.js app (change to .NET/Java/etc. as needed)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # 2️⃣ BUILD & PUSH DOCKER IMAGE TO ACR
  docker_build_and_push:
    name: "Docker Build & Push to ACR"
    runs-on: ubuntu-latest
    needs: build_and_test   # run only if tests passed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        run: |
          echo "${{ env.ACR_PASSWORD }}" | docker login ${{ env.ACR_LOGIN_SERVER }} \
            --username ${{ env.ACR_USERNAME }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Save image name for next job
        run: echo "FULL_IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_ENV

  # 3️⃣ DEPLOY TO AZURE WEB APP (CONTAINER)
  deploy:
    name: "Deploy to Azure Web App (Container)"
    runs-on: ubuntu-latest
    needs: docker_build_and_push
    environment:
      name: production

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Web App to use new image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Show deployment info
        run: |
          echo "Deployed image:"
          echo "${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
